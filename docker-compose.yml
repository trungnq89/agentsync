services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentsync
      POSTGRES_PASSWORD: agentsync
      POSTGRES_DB: agentsync
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsync"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
