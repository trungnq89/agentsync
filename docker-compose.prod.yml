# Production stack: app + Postgres. The db port is NOT published.
# Required: POSTGRES_PASSWORD. Optional: SETTINGS_ENCRYPTION_KEY (needed for Odoo sync and Slack), APP_URL, DEFAULT_TIMEZONE, COOKIE_SECURE, APP_PORT, DEFAULT_LOCALE, ALLOWED_ORIGINS (build-time).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agentsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsync"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentsync:${POSTGRES_PASSWORD}@db:5432/agentsync
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      # Runtime only (encrypts the Odoo API key). Generate: openssl rand -base64 32
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # IANA zone for Slack digests until someone picks another
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
